name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, test and build
        run: npm run verify