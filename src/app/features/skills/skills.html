<section class="section" aria-labelledby="skills-title">
  <div class="container">
    <header class="section-heading" arthReveal>
      <p class="eyebrow">Technical skills</p>
      <h2 id="skills-title">The tools I <span class="text-gradient">build with</span></h2>
    </header>

    <ul class="skills__grid" role="list">
      @for (category of categories; track category.id) {
        <li class="skills__item">
          <arth-glass-card arthReveal [arthRevealDelay]="($index % 3) * 0.1">
            <h3 class="skills__title">{{ category.title }}</h3>
            @if (category.description) {
              <p class="skills__description text-muted">{{ category.description }}</p>
            }
            <ul class="chips" role="list">
              @for (skill of category.skills; track skill) {
                <li class="chip">{{ skill }}</li>
              }
            </ul>
          </arth-glass-card>
        </li>
      }
    </ul>
  </div>
</section>
