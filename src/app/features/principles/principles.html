<section class="section" aria-labelledby="principles-title">
  <div class="container">
    <header class="section-heading" arthReveal>
      <p class="eyebrow">Engineering principles</p>
      <h2 id="principles-title">How I <span class="text-gradient">work</span></h2>
    </header>

    <ol class="principles__grid" role="list">
      @for (principle of principles; track principle.id) {
        <li class="principles__item">
          <arth-glass-card
            arthReveal
            [arthRevealDelay]="($index % 3) * 0.1"
            [arthTilt]="10"
          >
            <span class="principles__number" aria-hidden="true">{{ ($index + 1).toString().padStart(2, '0') }}</span>
            <h3 class="principles__title">{{ principle.title }}</h3>
            <p class="text-muted">{{ principle.description }}</p>
          </arth-glass-card>
        </li>
      }
    </ol>
  </div>
</section>
